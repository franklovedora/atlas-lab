<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#133e37"><title>账期 Atlas · 账户任务总览</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span class="logo">▥</span>账期 <em>Atlas</em></div><span class="headnote">个人账户管理</span><button id="account">账号登录</button><button id="mode"></button></header>
<main><div class="intro"><div><small>CHRONOMETRY LAB</small><h1>账期观测台</h1><p id="today"></p></div><button class="primary" id="add">＋ 新建任务</button></div>
<section class="summary"><div class="hero"><small>本期任务进度</small><div class="big" id="percent"></div><span id="count"></span><div class="tubes" aria-hidden="true"><i>0</i><i>4</i><i>8</i><i>6</i></div></div><div class="metric"><div class="metricIcon">◷</div><small>7 天内到期</small><strong id="soon"></strong></div><div class="metric"><div class="metricIcon amber">✧</div><small>进行中奖励金额</small><strong id="rewards"></strong></div></section>
<p id="syncstatus" role="status"></p><div class="columns"><section><div class="heading"><h2>任务清单</h2><span id="total"></span></div><nav id="filters"></nav><div id="rows"></div></section><aside><div class="heading"><h2>截止日提醒</h2><button id="export" title="导出日历提醒">导出日历 ↗</button></div><div id="upcoming"></div><p class="hint">将日历文件导入系统日历，可在截止前 3 天和 1 天收到提醒。</p><details><summary>账本备份与迁移</summary><p class="hint">导出自己的全部任务。导入时会按任务编号合并，同编号以备份为准。</p><button id="backup">导出 JSON</button> <button id="restore">导入 JSON</button><input id="backupfile" type="file" accept=".json" hidden></details></aside></div></main>
<dialog><form id="form"><div class="heading"><h2 id="dialogtitle"></h2><button type="button" id="close">✕</button></div><div id="fields"></div><div class="actions"><button type="button" id="remove">删除任务</button><button class="primary">保存</button></div></form></dialog><dialog id="auth"><form id="loginform"><div class="heading"><h2>登录同步账本</h2><button type="button" id="dismiss">✕</button></div><label>邮箱<input required type="email" name="email" autocomplete="username"></label><label>密码<input required type="password" name="password" autocomplete="current-password"></label><p id="authmsg" role="status"></p><div class="actions"><button value="register">注册账号</button><button class="primary" value="login">登录</button></div></form></dialog><script src="config.js"></script><script src="cloud.js"></script><script src="app.js"></script></body></html>
